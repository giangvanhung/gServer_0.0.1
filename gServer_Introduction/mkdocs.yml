site_name: gServer — Tài liệu kỹ thuật WebGIS
site_description: WCF REST service .NET 4.5.1 — API JSON cho hệ thống WebGIS quản lý lớp bản đồ và đối tượng không gian
site_author: gClient Team

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Chuyển sang dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Chuyển sang light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.integrate

nav:
  - Tổng quan: index.md
  - Bài toán & Giải pháp: problem.md
  - Kiến trúc hệ thống: architecture.md
  - Cơ sở dữ liệu: database.md
  - Backend (gServer): backend.md
  - Frontend (gClient): frontend.md
  - Luồng dữ liệu: dataflow.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
