site_name: WebGIS — gClient & gServer
site_description: Tài liệu kỹ thuật đầy đủ dự án WebGIS (WCF + ExtJS 8 + OpenLayers 10 + SQL Server)
site_author: gClient Team

theme:
  name: material
  language: vi
  palette:
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Chuyển sang dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Chuyển sang light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.highlight

nav:
  - Tổng quan: index.md
  - Kiến trúc hệ thống: architecture.md
  - Cơ sở dữ liệu: database.md
  - Backend — gServer: backend.md
  - Frontend — gClient: frontend.md
  - API Reference: api.md
  - Luồng dữ liệu: dataflow.md
  - Modules chi tiết:
    - LayerController: modules/layer-controller.md
    - EditLayerController: modules/edit-layer.md
    - FeatureCRUD Panel: modules/feature-crud.md
    - Vẽ & WKT: modules/draw-wkt.md
  - Kỹ thuật & Gotchas: gotchas.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - def_list
  - footnotes

extra_javascript:
  - https://unpkg.com/mermaid/dist/mermaid.min.js
